<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RK RAJA XWD // ROOT ACCESS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- 3D Video / Matrix BG -->
<canvas id="matrix"></canvas>
<video id="bgvideo" autoplay muted loop playsinline>
  <source src="/bg.mp4" type="video/mp4" />
</video>
<div class="scanlines"></div>

<div class="wrap">

  <!-- HEADER -->
  <div class="topbar">
    <span class="glitch" data-text="RK RAJA XWD">RK RAJA XWD</span>
    <span class="blink">[ ROOT@KALI:~# ]</span>
  </div>

  <!-- LIVE MONITOR -->
  <div class="card">
    <h2 class="title">▶ LIVE MONITOR</h2>
    <div class="row"><span>&gt; UPTIME</span><b id="uptime">0h 0m 0s</b></div>
    <div class="row"><span>&gt; ACTIVE TASKS</span><b id="activeTasks">0</b></div>
    <div class="row"><span>&gt; MESSAGES SENT</span><b id="totalSent">0</b></div>
    <div class="row"><span>&gt; STATUS</span><b id="connStatus" class="red">OFFLINE</b></div>
  </div>

  <!-- START TASK -->
  <div class="card">
    <h2 class="title">▶ START TASK</h2>

    <label class="lbl">[ Cookie Input Method ]</label>
    <select id="cookieMethod" class="inp">
      <option value="paste">PASTE_COOKIES</option>
      <option value="file">UPLOAD_FILE</option>
    </select>

    <div id="cookiePasteBox">
      <label class="lbl">[ Cookies ]</label>
      <textarea id="cookies" class="inp ta" placeholder='[{"key":"c_user","value":"..."}] OR c_user=...; xs=...;'></textarea>
    </div>

    <div id="cookieFileBox" style="display:none">
      <label class="lbl">[ Cookie File ]</label>
      <input type="file" id="cookieFile" accept=".json,.txt" class="file" />
    </div>

    <label class="lbl">[ Message File ]</label>
    <input type="file" id="msgFile" accept=".txt,.csv" class="file" />

    <label class="lbl">[ Thread ID ]</label>
    <input type="text" id="threadId" class="inp" placeholder="optional single target uid" />

    <label class="lbl">[ Delay (sec) ]</label>
    <input type="number" id="delay" class="inp" value="10" min="2" />

    <label class="lbl">[ Haters Name ]</label>
    <input type="text" id="hatersName" class="inp" value="RK" />

    <label class="lbl">[ Last Name ]</label>
    <input type="text" id="lastName" class="inp" value="RAJA XWD" />

    <button id="startBtn" class="btn green">▶ EXECUTE</button>
  </div>

  <!-- STOP TASK -->
  <div class="card">
    <h2 class="title">▶ STOP TASK</h2>
    <label class="lbl">[ Task ID ]</label>
    <input type="text" id="stopTaskId" class="inp" placeholder="TASK-..." />
    <button id="stopBtn" class="btn red">■ TERMINATE</button>
  </div>

  <!-- LOG -->
  <div class="card">
    <h2 class="title">▶ TERMINAL LOG</h2>
    <div id="log" class="log">&gt; Waiting for connection...<span class="cursor">_</span></div>
  </div>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const BACKEND = window.location.hostname.includes("netlify")
  ? "https://YOUR-RENDER-BACKEND.onrender.com"
  : window.location.origin;

const socket = io(BACKEND, { reconnection: true });
const $ = (id) => document.getElementById(id);
let currentTaskId = null;

$("cookieMethod").onchange = () => {
  const m = $("cookieMethod").value;
  $("cookiePasteBox").style.display = m === "paste" ? "block" : "none";
  $("cookieFileBox").style.display = m === "file" ? "block" : "none";
};

function readFile(input) {
  return new Promise((res, rej) => {
    const f = input.files[0];
    if (!f) return res(null);
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsText(f);
  });
}

$("startBtn").onclick = async () => {
  const method = $("cookieMethod").value;
  let cookies = method === "paste" ? $("cookies").value.trim() : ((await readFile($("cookieFile"))) || "");
  const msgText = (await readFile($("msgFile"))) || "";
  const threadId = $("threadId").value.trim();

  if (!cookies) return log("error", "✖ Cookies required!");
  if (!msgText && !threadId) return log("error", "✖ Message file ya Thread ID do!");

  $("startBtn").disabled = true;
  $("startBtn").textContent = "⏳ INITIALIZING...";
  log("info", "> Injecting cookies...");

  try {
    const res = await fetch(BACKEND + "/api/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cookies, targetsText: msgText || threadId, threadId: threadId || null,
        delay: $("delay").value,
        hatersName: $("hatersName").value,
        lastName: $("lastName").value,
      }),
    });
    const d = await res.json();
    if (!d.ok) {
      log("error", "✖ " + d.error);
      $("startBtn").disabled = false;
      $("startBtn").textContent = "▶ EXECUTE";
      return;
    }
    currentTaskId = d.taskId;
    $("stopTaskId").value = d.taskId;
    socket.emit("subscribe", d.taskId);
    log("success", `✔ ACCESS GRANTED: ${d.taskId} | UID ${d.uid} | ${d.total} targets`);
    $("startBtn").textContent = "✔ RUNNING";
  } catch (e) {
    log("error", "✖ " + e.message);
    $("startBtn").disabled = false;
    $("startBtn").textContent = "▶ EXECUTE";
  }
};

$("stopBtn").onclick = async () => {
  const taskId = $("stopTaskId").value.trim();
  if (!taskId) return log("error", "✖ Task ID required");
  const res = await fetch(BACKEND + "/api/stop", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ taskId }),
  });
  const d = await res.json();
  if (!d.ok) return log("error", "✖ " + d.error);
  log("warn", "⚠ Terminate signal sent");
  $("startBtn").disabled = false;
  $("startBtn").textContent = "▶ EXECUTE";
};

async function refreshMonitor() {
  try {
    const r = await fetch(BACKEND + "/api/monitor");
    const d = await r.json();
    const s = Math.floor(d.uptime);
    $("uptime").textContent = `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m ${s%60}s`;
    $("activeTasks").textContent = d.activeTasks;
    $("totalSent").textContent = d.totalSent;
  } catch {}
}
setInterval(refreshMonitor, 2000);
refreshMonitor();

socket.on("connect", () => {
  $("connStatus").textContent = "ONLINE";
  $("connStatus").className = "green";
  log("success", "✔ Backend connected");
});
socket.on("disconnect", () => {
  $("connStatus").textContent = "OFFLINE";
  $("connStatus").className = "red";
  log("warn", "⚠ Connection lost, reconnecting...");
});
socket.on("connect_error", () => log("warn", "⚠ Connection lost, reconnecting..."));

socket.on("log", (l) => log(l.type, l.msg));
socket.on("progress", (p) => log("info", `> [${p.idx}/${p.total}] → ${p.currentUID}`));
socket.on("stats", () => {});

function log(type, msg) {
  const box = $("log");
  const t = new Date().toLocaleTimeString();
  const line = document.createElement("div");
  line.className = "log-line " + type;
  line.textContent = `[${t}] ${msg}`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
  if (box.children.length > 300) box.removeChild(box.firstChild);
}

// ---------- MATRIX RAIN ----------
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
let cols, drops;
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  cols = Math.floor(canvas.width / 16);
  drops = Array(cols).fill(1);
}
resize();
window.addEventListener("resize", resize);
const chars = "RKRAJAXWD01アイウエオカキクケコサシスセソ<>/\\{}[]#$%&01";
setInterval(() => {
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#00ff41";
  ctx.font = "16px monospace";
  for (let i = 0; i < drops.length; i++) {
    const t = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillText(t, i * 16, drops[i] * 16);
    if (drops[i] * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}, 55);
</script>
</body>
</html>
